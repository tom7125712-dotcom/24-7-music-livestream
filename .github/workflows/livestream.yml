name: Manual Livestream Smoke Test

on:
  workflow_dispatch:
    inputs:
      stream_minutes:
        description: Minutes to test the stream before this run exits
        required: true
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: music-livestream-smoke-test
  cancel-in-progress: true

jobs:
  livestream:
    name: Test RTMP stream
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RTMP_URL: ${{ secrets.RTMP_URL }}
      STREAM_KEY: ${{ secrets.STREAM_KEY }}
      FULL_RTMP_URL: ${{ secrets.FULL_RTMP_URL }}
      IMAGE_FILE: assets/background.png
      AUDIO_FILE: assets/music.mp3
      WIDTH: 1920
      HEIGHT: 1080
      FPS: 30
      VIDEO_BITRATE: 3500k
      AUDIO_BITRATE: 192k
      STREAM_MINUTES: ${{ inputs.stream_minutes || '30' }}
      RESTART_DELAY: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate stream settings
        run: |
          if [ -z "$FULL_RTMP_URL" ] && { [ -z "$RTMP_URL" ] || [ -z "$STREAM_KEY" ]; }; then
            echo "Set either FULL_RTMP_URL or both RTMP_URL and STREAM_KEY as repository secrets." >&2
            exit 2
          fi
          test -f "$IMAGE_FILE"
          test -f "$AUDIO_FILE"

      - name: Start livestream
        run: sh scripts/run-github-actions.sh
