name: Segmented GitHub Actions Livestream

on:
  workflow_dispatch:
    inputs:
      stream_minutes:
        description: Minutes to stream in this segment. Values above 295 are clamped.
        required: true
        default: "295"
        type: string
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: read

concurrency:
  group: music-livestream
  cancel-in-progress: false

jobs:
  livestream:
    name: Stream RTMP segment
    runs-on: ubuntu-latest
    timeout-minutes: 310
    env:
      RTMP_URL: ${{ secrets.RTMP_URL }}
      STREAM_KEY: ${{ secrets.STREAM_KEY }}
      FULL_RTMP_URL: ${{ secrets.FULL_RTMP_URL }}
      IMAGE_FILE: assets/background.png
      AUDIO_FILE: assets/music.mp3
      WIDTH: 1920
      HEIGHT: 1080
      FPS: 30
      VIDEO_BITRATE: 3500k
      AUDIO_BITRATE: 192k
      STREAM_MINUTES: ${{ inputs.stream_minutes || '295' }}
      RESTART_DELAY: 15
      MIN_REMAINING_SECONDS: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate stream settings
        run: |
          if [ -z "$FULL_RTMP_URL" ] && { [ -z "$RTMP_URL" ] || [ -z "$STREAM_KEY" ]; }; then
            echo "Set either FULL_RTMP_URL or both RTMP_URL and STREAM_KEY as repository secrets." >&2
            exit 2
          fi
          test -f "$IMAGE_FILE"
          test -f "$AUDIO_FILE"

      - name: Start livestream segment
        run: |
          case "$STREAM_MINUTES" in
            ''|*[!0-9]*)
              echo "stream_minutes must be a positive integer." >&2
              exit 2
              ;;
          esac
          if [ "$STREAM_MINUTES" -le 0 ]; then
            echo "stream_minutes must be greater than zero." >&2
            exit 2
          fi
          if [ "$STREAM_MINUTES" -gt 295 ]; then
            echo "GitHub-hosted jobs are temporary; clamping stream_minutes to 295 to reduce queued run churn."
            STREAM_MINUTES=295
          fi
          export STREAM_MINUTES
          sh scripts/run-github-actions.sh
